version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: transport_postgres
    environment:
      POSTGRES_USER: franco
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transport_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: