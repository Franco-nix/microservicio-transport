<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Viajes - Transporte</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Portal de Transporte - Microservicio</h2>

    <!-- SECCIÓN 1: FORMULARIO PARA REGISTRAR UN VIAJE (POST) -->
    <div class="card mb-5">
        <div class="card-header bg-success text-white">Registrar Nuevo Viaje</div>
        <div class="card-body">
            <form id="tripForm">
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Origen</label>
                        <input type="text" id="origin" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Destino</label>
                        <input type="text" id="destination" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Fecha y Hora de Salida</label>
                        <input type="datetime-local" id="departureDate" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Precio ($)</label>
                        <input type="number" step="0.01" id="price" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Guardar Viaje</button>
            </form>
            <div id="responseMessage" class="mt-3"></div>
        </div>
    </div>

    <!-- SECCIÓN 2: BUSCADOR EXISTENTE (GET) -->
    <div class="card">
        <div class="card-header bg-primary text-white">Consultar Viajes Disponibles</div>
        <div class="card-body">
            <form id="searchForm" class="row g-2 mb-3">
                <div class="col">
                    <input type="text" id="searchOrigin" class="form-control" placeholder="Origen...">
                </div>
                <div class="col">
                    <input type="text" id="searchDestination" class="form-control" placeholder="Destino...">
                </div>
                <div class="col">
                    <input type="text" id="searchVehicleType" class="form-control" placeholder="Tipo de vehículo...">
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Fecha</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tripsBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Cargando viajes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCRIPT DE JAVASCRIPT PARA USAR LA API -->
    <script>
        async function deleteTrip(id) {
            if (!confirm('¿Eliminar este viaje?')) return;

            try {
                const response = await fetch(`/api/trips/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                loadTrips();
            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo eliminar el viaje.');
            }
        }

        async function loadTrips() {
            const params = new URLSearchParams();
            const origin = document.getElementById('searchOrigin').value.trim();
            const destination = document.getElementById('searchDestination').value.trim();
            const vehicleType = document.getElementById('searchVehicleType').value.trim();

            if (origin) params.append('origin', origin);
            if (destination) params.append('destination', destination);
            if (vehicleType) params.append('vehicleType', vehicleType);

            const tbody = document.getElementById('tripsBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Cargando viajes...</td></tr>`;

            try {
                const response = await fetch(`/api/trips?${params.toString()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const trips = await response.json();
                tbody.innerHTML = '';

                if (trips.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No se encontraron viajes</td></tr>`;
                    return;
                }

                trips.forEach(trip => {
                    const row = document.createElement('tr');
                    const cells = [
                        trip.id,
                        trip.route ? trip.route.origin : '',
                        trip.route ? trip.route.destination : '',
                        trip.departureDate ? trip.departureDate.replace('T', ' ').slice(0, 16) : '',
                        trip.price
                    ];
                    cells.forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value ?? '';
                        row.appendChild(td);
                    });

                    const actionsTd = document.createElement('td');
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn btn-sm btn-danger';
                    deleteBtn.textContent = 'Eliminar';
                    deleteBtn.addEventListener('click', () => deleteTrip(trip.id));
                    actionsTd.appendChild(deleteBtn);
                    row.appendChild(actionsTd);

                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error al consultar los viajes.</td></tr>`;
            }
        }

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            loadTrips();
        });

        document.getElementById('tripForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que la página se recargue por completo

            // 1. Capturar los valores de los inputs
            const tripData = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                departureDate: document.getElementById('departureDate').value,
                price: parseFloat(document.getElementById('price').value)
            };

            try {
                // 2. Hacer la petición POST al microservicio usando Fetch API
                const response = await fetch('/api/trips', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(tripData) // Convertir el objeto JS a JSON
                });

                const msgDiv = document.getElementById('responseMessage');

                if (response.ok) {
                    msgDiv.innerHTML = `<div class="alert alert-success">¡Viaje registrado con éxito!</div>`;
                    document.getElementById('tripForm').reset(); // Limpiar formulario
                    loadTrips(); // Refrescar la tabla usando la API
                } else {
                    msgDiv.innerHTML = `<div class="alert alert-danger">Error al registrar el viaje.</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('responseMessage').innerHTML = `<div class="alert alert-danger">Error de red con el servidor.</div>`;
            }
        });

        loadTrips();
    </script>
</body>
</html>
